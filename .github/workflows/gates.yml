# ─────────────────────────────────────────────────────────────────────────────
# THE GATES — one sequence, called by verify and by release.
#
# A REUSABLE WORKFLOW rather than a composite action, so `release.yml` can `needs:` it as a
# SEPARATE JOB. That separation is a security argument and not an aesthetic one: the gates
# run with `contents: read` and no credential, and only the publish job that depends on them
# is granted `id-token: write` and the registry token. A composite action would run every
# one of these steps inside the privileged job.
#
# The price is a second cold clone and a second build, and that is the correct price: the
# release must ITSELF be a cold clone, because a cold clone is the only configuration in
# which the missing-bin-symlink trap and the project-before-test ordering are exercised.
# ─────────────────────────────────────────────────────────────────────────────
name: gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # FULL HISTORY IS REQUIRED, because the immutability gate below judges a range of
      # commits: it diffs every commit in the range against each of its parents, and for a
      # push compares the range's endpoints. On a depth-1 clone neither the parents nor
      # `before` exist, so the range it must read is not there. Softening the gate when
      # history is shallow would make it dark exactly where nobody is watching.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # THE IMMUTABILITY GATE: every commit in the range is judged against each of its
      # parents, and any change under the records root that is not an addition is refused,
      # naming its paths — so a later commit cannot mask an earlier edit. It runs from
      # source, so it needs no build and runs before one. A pull request is read as its
      # commits (base..head: those head holds and base does not, so records main gained
      # since the fork are never read). A push is read as its commits `before..after` AND
      # its endpoints: a record present at `before` that `after` does not hold unchanged
      # (bytes, mode, presence) is refused, which is the only reading that sees a force-push
      # or an amend drop or rewrite a record. A force-push leaves
      # `before` on no branch, so a full-history clone can still lack it; it is fetched by
      # sha. A push with no `before` (the zero sha, a new branch) and any other event read
      # the whole history of head.
      - name: immutability-gate
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          case "$EVENT" in
            pull_request) set -- "$PR_BASE..$PR_HEAD" ;;
            push)
              if [ -z "${PUSH_BEFORE//0/}" ]; then
                set -- HEAD
              else
                git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "$PUSH_BEFORE"
                set -- --push "$PUSH_BEFORE" "$PUSH_AFTER"
              fi ;;
            *) set -- HEAD ;;
          esac
          echo "immutability-gate $*"
          pnpm --silent --filter @cratylus/runtime immutability-gate "$@"

      # Build ONCE, up front. The projection step used to build as well, so a run could interleave
      # two builds: tsup emits content-hashed chunks under `clean: true`, and a rebuild
      # landing after another task resolved `main.js` left it importing a chunk that no
      # longer existed.
      - name: build
        run: pnpm build

      # `cratylus` is a root devDependency at `workspace:*`, so pnpm links it into
      # `node_modules/.bin` on install. CI exercises the same binding a developer has,
      # and the package manager owns PATH.
      - name: put the workspace bin on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: lint
        run: pnpm lint

      # PROJECT BEFORE TEST, and the order is load-bearing. `harness-parity.test.ts`
      # reads `.cratylus/{claude,omp}` — one per harness — and those are
      # gitignored build output, so on a fresh checkout they do not exist and nothing
      # in the turbo task graph makes them.
      #
      # This step used to compute a whole-tree render hash, projecting every harness as a
      # SIDE EFFECT. The hash is retired; the projection it was secretly providing is
      # not, so the step is now named for what it does.
      - name: project every harness
        run: pnpm canon:project && pnpm canon:project:omp

      # `test` depends on `typecheck:test` in turbo.json, so this leg type-checks the test
      # tree too. The tests ARE the enforcement layer for every naming and shape guarantee
      # here; an unchecked test tree is an unchecked enforcement layer.
      - name: test
        run: pnpm test

      - name: typecheck
        run: pnpm typecheck

      # PACK SMOKE — the only leg that reads what a CONSUMER receives, and it runs on every
      # PR rather than only on release. A gate that only the release runs is a gate that
      # fails at the worst possible moment, and this one guards the single artifact that
      # cannot be taken back.
      - name: pack smoke
        run: pnpm pack:smoke
