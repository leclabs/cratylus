# ─────────────────────────────────────────────────────────────────────────────
# THE GATES — one sequence, called by verify and by release.
#
# A REUSABLE WORKFLOW rather than a composite action, so `release.yml` can `needs:` it as a
# SEPARATE JOB. That separation is a security argument and not an aesthetic one: the gates
# run with `contents: read` and no credential, and only the publish job that depends on them
# is granted `id-token: write` and the registry token. A composite action would run every
# one of these steps inside the privileged job.
#
# The price is a second cold clone and a second build, and that is the correct price: the
# release must ITSELF be a cold clone, because a cold clone is the only configuration in
# which the missing-bin-symlink trap and the project-before-test ordering are exercised.
# ─────────────────────────────────────────────────────────────────────────────
name: gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # FULL HISTORY IS REQUIRED, and the claim it replaces was measured false on the first
      # run. This said shallow was enough "because every leg that touches git reads
      # `git ls-files` against the working tree, or builds its own repository in a tmpdir".
      # That stopped being true when the DESIGNATOR-VERACITY oracle landed: it derives the
      # set of retired shard designators from `git log` over `plans/`, so on a depth-1 clone
      # its subject does not exist. The reach leg caught it — "the retired-id set collapsed"
      # — which is that leg doing precisely the job it was written for, on a runner rather
      # than on a laptop.
      #
      # This is the cost of a history-derived oracle, and it is paid here rather than worked
      # around: softening the gate when history is shallow would make it dark exactly where
      # nobody is watching.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # THE IMMUTABILITY GATE over the pushed range: any change under the records root
      # that is not an addition is refused, naming its paths. It runs from source, so it
      # needs no build and runs before one. The range is the pull request's base to head
      # (three dots: from their merge base, so records main gained since the fork are not
      # read as deletions), or a push's `before` to `after`. A push with no `before` (the
      # zero sha, a new branch) and any other event read the whole tree: the empty tree
      # to head. `fetch-depth: 0` above holds every commit the range names.
      - name: immutability-gate
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          whole="$(git hash-object -t tree /dev/null)..HEAD"
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push)
              if [ -z "${PUSH_BEFORE//0/}" ]; then range="$whole"; else range="$PUSH_BEFORE..$PUSH_AFTER"; fi ;;
            *) range="$whole" ;;
          esac
          echo "immutability-gate over $range"
          pnpm --silent --filter @cratylus/runtime immutability-gate "$range"

      # Build ONCE, up front. The projection step used to build as well, so a run could interleave
      # two builds: tsup emits content-hashed chunks under `clean: true`, and a rebuild
      # landing after another task resolved `main.js` left it importing a chunk that no
      # longer existed.
      - name: build
        run: pnpm build

      # `cratylus` is a root devDependency at `workspace:*`, so pnpm links it into
      # `node_modules/.bin` on install. CI exercises the same binding a developer has,
      # and the package manager owns PATH.
      - name: put the workspace bin on PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: lint
        run: pnpm lint

      # PROJECT BEFORE TEST, and the order is load-bearing. `harness-parity.test.ts`
      # reads `.cratylus/{claude,codex,omp}` — one per harness — and those are
      # gitignored build output, so on a fresh checkout they do not exist and nothing
      # in the turbo task graph makes them.
      #
      # This step used to compute a whole-tree render hash, projecting all three as a
      # SIDE EFFECT. The hash is retired; the projection it was secretly providing is
      # not, so the step is now named for what it does.
      - name: project every harness
        run: pnpm canon:project && pnpm canon:project:codex && pnpm canon:project:omp

      # `test` depends on `typecheck:test` in turbo.json, so this leg type-checks the test
      # tree too. The tests ARE the enforcement layer for every naming and shape guarantee
      # here; an unchecked test tree is an unchecked enforcement layer.
      - name: test
        run: pnpm test

      - name: typecheck
        run: pnpm typecheck

      # PACK SMOKE — the only leg that reads what a CONSUMER receives, and it runs on every
      # PR rather than only on release. A gate that only the release runs is a gate that
      # fails at the worst possible moment, and this one guards the single artifact that
      # cannot be taken back.
      - name: pack smoke
        run: pnpm pack:smoke
