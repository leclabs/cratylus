# ─────────────────────────────────────────────────────────────────────────────
# THE RELEASE GATE.
#
# This repository had no CI. Every green claim it made — the suite, the type
# check, the render oracle — was a claim about somebody's laptop. That is the
# same defect the corpus already names for prose: a property nothing checks is a
# property that drifts silently.
#
# The legs themselves live in `gates.yml` and are called from here and from `release.yml`.
# They are ordered cheapest-first so a failure reports fast, but none is optional and none
# is `continue-on-error`. A gate that can be skipped is a gate that will be.
# ─────────────────────────────────────────────────────────────────────────────
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE STEP SEQUENCE MOVED TO `gates.yml`, and this is not tidying. `release.yml` needs the
  # identical sequence, and two copies of a gate sequence drift — the copy that drifts is
  # always the one that runs less often, which is the release.
  verify:
    uses: ./.github/workflows/gates.yml
