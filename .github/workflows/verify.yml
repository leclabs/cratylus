# ─────────────────────────────────────────────────────────────────────────────
# VERIFY — the check on every push to main and every pull request.
#
# The steps live in `check.yml`, called from here and from the release workflows, so
# there is one copy of what CI runs, and it is the local `pnpm check`.
# ─────────────────────────────────────────────────────────────────────────────
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/check.yml
