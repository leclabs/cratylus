# ─────────────────────────────────────────────────────────────────────────────
# THE RELEASE — `latest`.
#
# TWO JOBS, DELIBERATELY. `check` runs the one check (`check.yml`, the local `pnpm check`)
# on its own clone with `contents: read` and no credential. `release` is the ONLY job
# holding `id-token: write`, and it cannot start until `check` is green, so the credential is
# never held while the repository's own test code runs.
#
# The publish path is `scripts/release.sh`, called by the changesets action: pnpm packs,
# pack-smoke audits those exact tarballs, and pnpm uploads them with provenance. The audit
# belongs to publishing the bytes, not to the check.
#
# CANCEL-IN-PROGRESS IS FALSE, and that is not a default. A cancelled publish is a
# half-published release: some of five on the registry, irrevocably, at versions whose
# siblings do not exist.
# ─────────────────────────────────────────────────────────────────────────────
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the Release PR branch, the tags, the GitHub Releases
      pull-requests: write # open and update the Release PR
      id-token: write # npm provenance (OIDC). Public repo, so provenance is permitted.
    env:
      HUSKY: '0'
    steps:
      # fetch-depth: 0 IS REQUIRED HERE. `changeset tag` reads all tags,
      # the changelog generator resolves the commit that added each changeset, and the action
      # diffs against the base. A shallow clone makes all three quietly wrong rather than loud.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # For `registry-url` alone: it writes the `~/.npmrc` that points pnpm at the registry;
      # publishing authenticates by npm trusted publishing (OIDC), with no token. The node
      # version is read from `devEngines.runtime`, as the setup action reads it.
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org

      - id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          # DEFAULTS REJECTED. The action's default commit message is "Version Packages",
          # which `@commitlint/config-conventional` refuses on both `type-enum` and
          # `subject-empty`. `HUSKY: 0` already disarms the hook, but main's history is
          # conventional by policy and a release commit is not exempt from it.
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE: '1'

      - name: published
        if: steps.changesets.outputs.published == 'true'
        run: echo '${{ steps.changesets.outputs.publishedPackages }}' >> "$GITHUB_STEP_SUMMARY"
