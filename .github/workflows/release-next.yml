# ─────────────────────────────────────────────────────────────────────────────
# THE `next` CHANNEL — snapshots.
#
# SNAPSHOT, NOT PRE-RELEASE MODE. `changeset pre enter next` writes `.changeset/pre.json`
# INTO THE REPOSITORY, and while that file exists EVERY `changeset version` produces a
# prerelease — the stable Release PR is unreachable until someone remembers `pre exit`. This
# repository's `main` IS its release branch, so pre mode would lock the stable channel shut
# for the duration. Pre mode belongs on a dedicated `release/x.y` branch running a long beta;
# it is the wrong shape for a channel that shadows main. Snapshot is stateless: it versions,
# packs and publishes in a throwaway checkout and commits nothing.
#
# `workflow_dispatch` ONLY, and that is a decision rather than an omission. A snapshot per
# merge sounds like a canary and behaves like a firehose: five immutable npm versions per
# commit, forever, none of which anyone can name ("which of the 400 has the fix?"). Dispatch
# takes a ref, so every snapshot is a NAMED commit somebody wanted tested.
#
# IT REFUSES TO RUN BEFORE THE FIRST STABLE RELEASE, and this is the load-bearing guard.
# npm assigns `dist-tags.latest` to the FIRST version a package ever receives, whatever
# `--tag` says. A snapshot published into an empty package would pin `latest` to
# `0.0.0-next-<timestamp>` until a human ran `npm dist-tag add` by hand — for five packages,
# irrevocably in the meantime. This check is the cheapest possible defence against a mistake
# nobody can undo.
# ─────────────────────────────────────────────────────────────────────────────
name: release-next

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, branch or tag to snapshot'
        required: false
        default: main

concurrency:
  group: release-next
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/gates.yml

  snapshot:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # NO write: a snapshot creates no tag, no release, no commit
      id-token: write # provenance
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # `changeset version --snapshot` reads the changesets and the commits that added them.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # v6 for the same reason as `.github/actions/setup`: the node version is read out of
      # `devEngines.runtime`, which only v6.3.0+ can see. This step re-runs `setup-node`
      # purely for `registry-url` (the `~/.npmrc` + `NODE_AUTH_TOKEN` wiring), so it must
      # resolve the SAME version the setup action already installed — a literal here would be
      # a second copy of the pin, and a stale one the first time they disagreed.
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org

      # THE GUARD'S SET IS THE PUBLISH SET, and it had drifted from it in both
      # directions: it probed `@cratylus/invoke`, a name renamed to `cratylus` in
      # `bd88ef9b` and now deprecated on the registry, and it omitted `cratylus`
      # itself — the one package whose `latest` a canary would actually pin for every
      # consumer typing `npm i cratylus`. So it was green for a retired name and blind
      # to the live one.
      #
      # The set is spelled here rather than derived because `pack-smoke --list` needs an
      # install and a build, and this gate runs BEFORE both on purpose: refusing early
      # is the point. A drift between the two is caught by the release itself, which
      # uploads what the audit listed.
      - name: refuse before the first stable release
        run: |
          set -eu
          # `pnpm view`, NOT `npm view`, and stderr is KEPT. This loop ran `npm view` and
          # discarded stderr, so when npm began refusing to run here at all —
          # `devEngines.packageManager` is `pnpm` with `onFail: "error"`, which npm enforces
          # against itself — the refusal read as "no published version yet" and the guard
          # reported ALL SIX packages unpublished while every one was on the registry. A
          # probe that cannot tell "absent" from "I was refused" is not a probe.
          missing=''
          for p in cratylus @cratylus/canon @cratylus/forge @cratylus/memory @cratylus/runtime @cratylus/schema; do
            if ! err=$(pnpm view "$p" version 2>&1); then
              echo "pnpm view $p failed: $err" >&2
              missing="$missing $p"
            fi
          done
          if [ -n "$missing" ]; then
            echo "REFUSING: these packages have no published version yet:$missing" >&2
            echo "npm pins dist-tags.latest to the FIRST version a package receives, whatever" >&2
            echo "--tag says. Publishing a snapshot now would pin latest to a canary." >&2
            exit 2
          fi

      # A SNAPSHOT NEEDS SOMETHING TO SNAPSHOT.
      #
      # `changeset version --snapshot` derives its version from the PENDING changesets. With
      # none, it changes nothing — and the run then tries to publish the current version
      # again, which npm refuses: `You cannot publish over the previously published versions:
      # 0.1.1`. Measured on the first dispatch. That error is correct and unhelpful: it
      # describes the collision rather than the empty input that caused it.
      #
      # Refused here instead, loudly, for the same reason the guard above refuses before the
      # first stable release: a channel that attempts something meaningless and reports a
      # registry error teaches the reader to distrust the registry.
      - name: refuse a snapshot with nothing to snapshot
        run: |
          set -eu
          pending=$(find .changeset -name '*.md' ! -name 'README.md' | grep -c . || true)
          if [ "$pending" -eq 0 ]; then
            echo "REFUSING: no pending changesets, so there is nothing to snapshot." >&2
            echo "A snapshot versions the CHANGES waiting to be released; with none, this" >&2
            echo "would republish the current version and npm would reject it." >&2
            exit 2
          fi
          echo "snapshotting $pending pending changeset(s)"

      - name: version as a snapshot
        run: pnpm exec changeset version --snapshot next

      # NO TOKEN HERE, AND THIS PATH IS NOT YET AUTHORIZED. Run 34569277070 proved the
      # mechanism and named the gap: the runner served an ID token for
      # `audience=npm:registry.npmjs.org` (200), pnpm signed a provenance statement, and npm
      # answered the token exchange with 404 —
      # `[WARN] Skipped OIDC: ERR_PNPM_AUTH_TOKEN_EXCHANGE … (status code 404)` — after which
      # the credential-less publish got the registry's 404 in turn. Nothing was published.
      #
      # An npm trusted-publisher configuration matches on WORKFLOW FILENAME. The one that
      # exists covers `release.yml`, which authenticated the stable release over OIDC minutes
      # later with no warning at all. THIS file needs its own configuration (npm has allowed
      # multiple per package since 2026-09-03) before a snapshot can publish.
      #
      # It stays tokenless until then, deliberately: a snapshot is a dispatched experiment,
      # and a loud 404 that names the missing configuration is worth more than a quiet
      # token-authenticated success that hides it.
      - name: publish to the next tag
        run: DIST_TAG=next pnpm run release
        env:
          PROVENANCE: '1'
