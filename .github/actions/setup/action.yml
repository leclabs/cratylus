# ─────────────────────────────────────────────────────────────────────────────
# THE SETUP TRIPLE — pnpm, node, install. One home, every workflow.
#
# A COMPOSITE ACTION rather than a reusable workflow, deliberately: this is a step sequence
# with no permissions, no concurrency and no job of its own, and it must run INSIDE whatever
# job needs it. The GATE sequence is the opposite shape and is a reusable workflow for
# exactly that reason — see `gates.yml`.
# ─────────────────────────────────────────────────────────────────────────────
name: setup
description: Install pnpm, the pinned Node, and the frozen workspace.

runs:
  using: composite
  steps:
    # BOTH HALVES OF THE TOOLCHAIN COME OUT OF `devEngines`, so neither is spelled here.
    # `pnpm/action-setup@v6` reads `devEngines.packageManager` when `version:` is omitted
    # (its README documents `packageManager` OR `devEngines.packageManager`), and it supports
    # pnpm v12, which this workspace now requires.
    - uses: pnpm/action-setup@v6

    # `setup-node` HAD to move to v6: reading a node version out of `devEngines.runtime`
    # landed in v6.3.0, so v5 cannot see the field at all and would have resolved nothing
    # once `.nvmrc` was deleted. v6's own behaviour change — narrowing AUTOMATIC
    # package-manager caching to npm — cannot reach this step, because `cache: pnpm` below is
    # explicit. v7 is still declined: it reworks the `NODE_AUTH_TOKEN` export, which is the
    # publish path, and that is a separate variable to move on its own.
    - uses: actions/setup-node@v6
      with:
        # THE PIN HAS ONE HOME AND THE CONSTRAINT HAS ANOTHER — see `mise.toml`'s header.
        # This reads `devEngines.runtime`, so the version CI installs is the one the install
        # would refuse to run without: `package.json` is checked BY the tool that enforces it,
        # which is what the deleted `.nvmrc` could never be.
        node-version-file: package.json
        cache: pnpm

    # `--frozen-lockfile` is the point: it fails if the lockfile disagrees with the
    # manifests, which is exactly the state a dependency edit can leave behind.
    #
    # HUSKY=0 IS LOAD-BEARING, not hygiene. `prepare: husky` runs on every install including
    # this one and sets `core.hooksPath` — after which any `git commit` in the job fires
    # `commit-msg` → commitlint. `changesets/action` DOES commit, and its default message is
    # not a conventional commit, so the Release PR fails to be created over its own title.
    - shell: bash
      env:
        HUSKY: '0'
      run: pnpm install --frozen-lockfile
