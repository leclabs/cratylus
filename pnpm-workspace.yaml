# Node workspace members live directly under packages/ (one dir = one package):
# agent-forge (the projection machinery), agent-memory (the portable memory store),
# and agent-canon (@leclabs/agent-canon) — the culture corpus, itself a TS workspace
# member: TS modules under src/ are the source, markdown is a projection.
packages:
  - "packages/*"

# Native deps permitted to run install scripts. pnpm 11 reads this map here —
# it ignores both package.json's "pnpm" field and pnpm 10's onlyBuiltDependencies
# list, and hard-fails the install (ERR_PNPM_IGNORED_BUILDS) on an unlisted build.
allowBuilds:
  "@biomejs/biome": true
  esbuild: true

# Shared dependency versions for the Node packages.
catalog:
  typescript: ^5.7.0
  tsup: ^8.3.0
  "@types/node": ^22.0.0
  zod: ^3.23.0
  js-yaml: ^4.1.0
  "@types/js-yaml": ^4.0.9
  vitest: ^2.1.0
  gray-matter: ^4.0.3
  cac: ^6.7.14
  picocolors: ^1.1.0
  "@iarna/toml": ^2.2.5
  chokidar: ^4.0.1
