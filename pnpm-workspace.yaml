# Node workspace members live directly under packages/ (one dir = one package). The
# scope carries the mark (@cratylus) so package names carry only the concern:
# forge (projection), runtime (mechanism), memory (a runtime strategy), schema
# (the shapes), invoke (the run-time entry), and canon (@cratylus/canon) — the
# culture corpus, itself a TS workspace
# member: TS modules under src/ are the source, markdown is a projection.
packages:
  - "packages/*"

# Native deps permitted to run install scripts. pnpm 11 reads this map here —
# it ignores both package.json's "pnpm" field and pnpm 10's onlyBuiltDependencies
# list, and hard-fails the install (ERR_PNPM_IGNORED_BUILDS) on an unlisted build.
allowBuilds:
  "@biomejs/biome": true
  esbuild: true

# Shared dependency versions for the Node packages.
catalog:
  typescript: ^5.7.0
  tsup: ^8.3.0
  "@types/node": ^22.0.0
  zod: ^3.23.0
  js-yaml: ^4.1.0
  "@types/js-yaml": ^4.0.9
  vitest: ^2.1.0
  gray-matter: ^4.0.3
  cac: ^6.7.14
  picocolors: ^1.1.0
  "@iarna/toml": ^2.2.5
  chokidar: ^4.0.1

# INJECTION IS WHAT MAKES `pnpm deploy` PRODUCE A CONSUMER ARTIFACT. Without it,
# deploy leaves `workspace:*` specifiers unresolved and the result cannot be
# installed anywhere — pnpm 10+ refuses the non-injected path for exactly that
# reason. Injected workspace deps are materialized as copies rather than symlinks,
# so a deployed tree is what a consumer would actually receive.
#
# This is what replaces packing tarballs and `npm install -g` in the e2e gate: the
# workspace already knows how to build a consumer install, and reaching for npm to
# simulate one was using the wrong tool and touching a global prefix to do it.
injectWorkspacePackages: true
