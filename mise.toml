# THE PIN LIVES HERE; THE CONSTRAINT LIVES IN `package.json`.
#
# `.nvmrc` used to hold the node pin, on the argument that the home should be the file the
# most tools already read. It was deleted because it had become the fourth statement in a
# disagreement it was supposed to end: `.nvmrc` said `24` while this file said `26.8.2` and
# the root manifest's `packageManager`/`engines` pair said `pnpm@11.21.0` / `>=24`.
#
# The split that survives is PIN vs CONSTRAINT, and it is not a duplication:
#   - PIN — the exact toolchain a contributor's shell and CI actually run. `[tools]` below,
#     read by mise; CI reads the node half out of `devEngines.runtime` via
#     `actions/setup-node@v6`'s `node-version-file: package.json`, and the pnpm half out of
#     `devEngines.packageManager` via `pnpm/action-setup@v6`.
#   - CONSTRAINT — what this workspace REFUSES to be developed with. `devEngines` in the root
#     `package.json`, with `onFail: "error"` on both halves: a mismatch stops the install
#     rather than downloading a second toolchain behind the contributor's back.
# The pin must satisfy the constraint, and the constraint is what fails loudly when it does
# not — which is the check `.nvmrc` could never perform, because a bare version file states a
# number and asserts nothing.
#
# Each PUBLISHED package's `engines.node` is a third, different fact: the floor a CONSUMER
# must clear. Collapsing it into either of the above is what produced the original drift.
[tools]
node = "26.8.2"
pnpm = "12.3.4"
python = "3.13"
uv = "latest"
